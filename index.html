<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy Shield - Remoção de Dados</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            border: 1px solid #334155;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }
        .header p {
            font-size: 14px;
            color: var(--text-muted);
            margin: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-muted);
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #475569;
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }
        #mensagemSucesso {
            display: none;
            text-align: center;
            padding: 20px;
            background-color: rgba(16, 185, 129, 0.1);
            border: 1px solid var(--success);
            border-radius: 8px;
            color: var(--success);
        }
        #mensagemSucesso h3 { margin-top: 0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>🛡️ Varredura de Privacidade</h1>
            <p>Descubra onde seus dados estão vazados e exija a exclusão via LGPD.</p>
        </div>

        <form id="formVarredura">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" placeholder="Ex: João da Silva" required>
            </div>
            <div class="form-group">
                <label for="whatsapp">WhatsApp (com DDD)</label>
                <input type="tel" id="whatsapp" placeholder="Ex: 11999999999" required>
            </div>
            <div class="form-group">
                <label for="cidade">Cidade / Estado</label>
                <input type="text" id="cidade" placeholder="Ex: São Paulo, SP" required>
            </div>
            <div class="form-group">
                <label for="cpf">CPF (Para maior precisão)</label>
                <input type="text" id="cpf" placeholder="Apenas números (Opcional)">
            </div>
            
            <button type="submit" class="btn" id="btnEnviar">Iniciar Varredura</button>
        </form>

        <div id="mensagemSucesso">
            <h3>✅ Busca Iniciada!</h3>
            <p>Nossa inteligência artificial está rastreando a web. Em até 2 horas, você receberá o relatório completo no WhatsApp cadastrado.</p>
        </div>
    </div>

    <script>
        document.getElementById('formVarredura').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('btnEnviar');
            btn.innerText = "Varrendo a web... Aguarde...";
            btn.disabled = true;

            const dados = {
                nome: document.getElementById('nome').value,
                whatsapp: document.getElementById('whatsapp').value,
                cidade: document.getElementById('cidade').value,
                cpf: document.getElementById('cpf').value
            };

            const urlAppsScript = https://script.google.com/macros/s/AKfycbxeFpAD8jdiwM50Xm4k_UUwXG4vQ2aBDRgCJWKaI3IYu3MORIjJ8fhbXnRT9W3lnvNA0w/exec;

            fetch(urlAppsScript, {
                method: "POST",
                mode: "no-cors",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(dados)
            })
            .then(() => {
                document.getElementById('formVarredura').style.display = 'none';
                document.getElementById('mensagemSucesso').style.display = 'block';
            })
            .catch(error => {
                alert("Ocorreu um erro ao processar. Tente novamente.");
                // Palavra removida do botão de reset de erro abaixo
                btn.innerText = "Iniciar Varredura";
                btn.disabled = false;
                console.error(error);
            });
        });
    </script>
</body>
</html>
