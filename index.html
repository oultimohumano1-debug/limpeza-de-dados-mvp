<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpeza de Dados</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 400px; background: #1e293b; padding: 20px; border-radius: 8px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <form id="formVarredura">
            <input type="text" id="nome" placeholder="Nome Completo" required>
            <input type="text" id="whatsapp" placeholder="WhatsApp" required>
            <input type="text" id="cidade" placeholder="Cidade" required>
            <input type="text" id="cpf" placeholder="CPF">
            <button type="submit" id="btnEnviar">Iniciar Varredura</button>
        </form>
        <div id="mensagemSucesso" style="display:none; color: #10b981;">✅ Sucesso!</div>
    </div>

    <script>
        document.getElementById('formVarredura').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('btnEnviar');
            btn.innerText = "Enviando...";
            btn.disabled = true;

            const dados = {
                "nome": document.getElementById('nome').value,
                "whatsapp": document.getElementById('whatsapp').value,
                "cidade": document.getElementById('cidade').value,
                "cpf": document.getElementById('cpf').value
            };

            const url = "https://script.google.com/macros/s/AKfycbxeFpAD8jdiwM50Xm4k_UUwXG4vQ2aBDRgCJWKaI3IYu3MORIjJ8fhbXnRT9W31nvNA0w/exec";

            fetch(url, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify(dados)
            }).then(function() {
                document.getElementById('formVarredura').style.display = 'none';
                document.getElementById('mensagemSucesso').style.display = 'block';
            }).catch(function(err) {
                alert("Erro, tente novamente.");
                btn.innerText = "Iniciar Varredura";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
